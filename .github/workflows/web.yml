name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "deploy/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "deploy/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Dependency install scripts stay blocked (pnpm.onlyBuiltDependencies is empty).
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The build reads the deployment from ../deploy; no secrets are needed to compile.
      - run: pnpm build
